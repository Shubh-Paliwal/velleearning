{%  load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<style>
    body{
        background-image: url('{% static 'feedbackoriginal.jpg' %}');
        background-repeat: no-repeat;
        background-size: 100%;
   }
    .divtheme{
        width: 600px;
        height: 400px;
        COLOR:WHITE;
        border-radius: 20px;
        background-repeat: no-repeat;
        margin-left:450px;
        margin-top: 210px;
        font-family: arial;

    }
    .tabtheme{
        text-transform: uppercase;
        font-family: arial;
        text-align: center;
        {#font-weight: bold  #}
        {#font-style: italic #}
        color: white;
        height: 60px;
         background-color:rgba(0,0,0,0.0);
        border-radius:40px;
        box-shadow: 10px 10px 10px white;
    }
    .texttheme{
        width: 400px;
        height: 35px;
        border: outset 4px;
    }
    a{
        color: white;
        text-decoration: none;
    }
    h1{
        font-family: "HoloLens MDL2 Assets";
        text-align: center;
        text-transform: uppercase;
        font-style: normal;
        font-weight: bold;
        font-size: 40px;
        color: white;
    }
</style>
<body>
<table width="100%" class="tabtheme">
    <tr>
       <td><a href="homelink">Home</a></td>
       <td><a href="aboutus">About Us</a></td>
       <td><a href="displayfeedbacklink"> Display Feedback</a></td>
       <td><a href="logoutlink">Logout</a></td>
    </tr>
</table>
 <h1> GIVE A HELPING FEEDBACK</h1>
<div class="divtheme">
    <form method="POST" action="feedbackactioncode">
    {% csrf_token %}    
    <table cellpadding="5px" cellspacing="14px" align="center" >

       
        <tr>
            <td>fullname:</td>
            <td><input type="text" name="fullname" class="texttheme"></td>
        </tr>
        <tr>
            <td>contact:</td>
            <td><input type="number" name="contact" class="texttheme"></td>
        </tr>
        <tr>
            <td>Feedback:</td>
            <td><textarea name="feedback" class="texttheme"></textarea></td>
        </tr>
        <tr>
           <td>
                Select category
            </td>
            <td>
                <select class="texttheme" name="category">
                    <option>select category</option>
                    <option>Job Provider</option>
                    <option>Job Seeker</option>
                </select>
            </td>
        </tr>

        <tr  align="center">
            <td  colspan="4"><input type="submit" class="buttontheme" style="alignment-baseline: center" value ="Submit">
            </td>
        </tr>
    </table>
    </form>
    </div>
</body>
</html>
